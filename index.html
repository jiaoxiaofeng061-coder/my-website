    function openLink(){showModal('添加网站','网站会添加到“'+current().name+'”分类','<label>网站名称<input name="name" placeholder="例如：企业邮箱" required></label><label>网址<input name="url" placeholder="例如：mail.example.com" required></label><label>说明（选填）<input name="description" placeholder="简单描述网站用途"></label><button class="primary">保存网站</button>',e=>{e.preventDefault();let u=e.target.url.value.trim();if(!/^https?:\/\//i.test(u))u='https://'+u;const n=e.target.name.value.trim();current().links.push({id:'l'+Date.now(),name:n,url:u,description:e.target.description.value.trim()||'自定义快捷链接',mark:n.slice(0,1).toUpperCase(),color:'#5865d8'});save();render();hideModal()})}
    function removeLink(id){current().links=current().links.filter(x=>x.id!==id);save();render()}
    function render(){const c=current();document.getElementById('categories').innerHTML=data.map(x=>`<div class="cat ${x.id===active?'active':''}"><button onclick="active='${x.id}';render()"><span class="badge">${esc(x.name.slice(0,1))}</span>${esc(x.name)}</button>${x.id===active?`<button class="edit" onclick="openCategory(true)" title="修改分类名称">✎</button>`:''}</div>`).join('');document.getElementById('title').textContent=c.name+'网站';document.getElementById('links').innerHTML=c.links.length?`<div class="grid">${c.links.map(l=>`<div class="wrap"><a class="card" href="${esc(l.url)}" target="_blank"><span class="mark" style="background:${esc(l.color)}">${esc(l.mark)}</span><span class="copy"><strong>${esc(l.name)}</strong><small>${esc(l.description)}</small></span><span>↗</span></a><button class="edit-link" onclick="openLink('${l.id}')" title="修改网站">✎</button><button class="del" onclick="removeLink('${l.id}')" title="删除网站">×</button></div>`).join('')}</div>`:`<button class="empty" onclick="openLink()">＋ 添加第一个网站</button>`}
    function openLink(editId){const item=editId?current().links.find(x=>x.id===editId):null;const n=item?item.name:'';const u=item?item.url:'';const d=item?item.description:'';showModal(item?'修改网站':'添加网站',item?'修改网站名称、网址或说明':'网站会添加到“'+current().name+'”分类',`<label>网站名称<input name="name" value="${esc(n)}" placeholder="例如：企业邮箱" required></label><label>网址<input name="url" value="${esc(u)}" placeholder="例如：mail.example.com" required></label><label>说明（选填）<input name="description" value="${esc(d)}" placeholder="简单描述网站用途"></label><button class="primary">${item?'保存修改':'保存网站'}</button>`,e=>{e.preventDefault();let url=e.target.url.value.trim();if(!/^https?:\/\//i.test(url))url='https://'+url;const name=e.target.name.value.trim();if(item){item.name=name;item.url=url;item.description=e.target.description.value.trim()||'自定义快捷链接';item.mark=name.slice(0,1).toUpperCase()}else{current().links.push({id:'l'+Date.now(),name,url,description:e.target.description.value.trim()||'自定义快捷链接',mark:name.slice(0,1).toUpperCase(),color:'#5865d8'})}save();render();hideModal()})}
    let draggedLinkId=null;
    function render(){const c=current();document.getElementById('categories').innerHTML=data.map(x=>`<div class="cat ${x.id===active?'active':''}"><button onclick="active='${x.id}';render()"><span class="badge">${esc(x.name.slice(0,1))}</span>${esc(x.name)}</button>${x.id===active?`<button class="edit" onclick="openCategory(true)" title="修改分类名称">✎</button>`:''}</div>`).join('');document.getElementById('title').textContent=c.name+'网站';document.getElementById('links').innerHTML=c.links.length?`<div class="grid">${c.links.map(l=>`<div class="wrap" draggable="true" ondragstart="dragStart(event,'${l.id}')" ondragend="dragEnd(event)" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="dropLink(event,'${l.id}')"><a class="card" href="${esc(l.url)}" target="_blank" draggable="false"><span class="mark" style="background:${esc(l.color)}">${esc(l.mark)}</span><span class="copy"><strong>${esc(l.name)}</strong><small>${esc(l.description)}</small></span></a><button class="edit-link" onclick="openLink('${l.id}')" title="修改网站">✎</button><button class="del" onclick="removeLink('${l.id}')" title="删除网站">×</button></div>`).join('')}</div>`:`<button class="empty" onclick="openLink()">＋ 添加第一个网站</button>`}
    function dragStart(event,id){draggedLinkId=id;event.currentTarget.classList.add('dragging');event.dataTransfer.effectAllowed='move';event.dataTransfer.setData('text/plain',id)}
    function dragEnd(event){event.currentTarget.classList.remove('dragging');document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));draggedLinkId=null}
    function dragOver(event){event.preventDefault();event.dataTransfer.dropEffect='move';event.currentTarget.classList.add('drag-over')}
    function dragLeave(event){event.currentTarget.classList.remove('drag-over')}
    function dropLink(event,targetId){event.preventDefault();event.currentTarget.classList.remove('drag-over');const sourceId=draggedLinkId||event.dataTransfer.getData('text/plain');if(!sourceId||sourceId===targetId)return;const links=current().links;const from=links.findIndex(x=>x.id===sourceId);const to=links.findIndex(x=>x.id===targetId);if(from<0||to<0)return;const moved=links.splice(from,1)[0];links.splice(to,0,moved);save();render()}
    function render(){const c=current();document.getElementById('categories').innerHTML=data.map(x=>`<div class="cat ${x.id===active?'active':''}"><button onclick="active='${x.id}';render()"><span class="badge">${esc(x.name.slice(0,1))}</span>${esc(x.name)}</button>${x.id===active?`<button class="edit" onclick="openCategory(true)" title="修改分类名称">✎</button>`:''}</div>`).join('');document.getElementById('title').textContent=c.name+'网站';const cards=c.links.map(l=>`<div class="wrap" draggable="true" ondragstart="dragStart(event,'${l.id}')" ondragend="dragEnd(event)" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="dropLink(event,'${l.id}')"><a class="card" href="${esc(l.url)}" target="_blank" draggable="false"><span class="mark" style="background:${esc(l.color)}">${esc(l.mark)}</span><span class="copy"><strong>${esc(l.name)}</strong><small>${esc(l.description)}</small></span></a><button class="edit-link" onclick="openLink('${l.id}')" title="修改网站">✎</button><button class="del" onclick="removeLink('${l.id}')" title="删除网站">×</button></div>`).join('');document.getElementById('links').innerHTML=`<div class="grid">${cards}<button class="add-site-card" onclick="openLink()"><b>＋</b><span>添加网站</span></button></div>`}
    let draggedCategoryId=null;
    function render(){const c=current();document.getElementById('categories').innerHTML=data.map(x=>`<div class="cat ${x.id===active?'active':''}" draggable="true" ondragstart="categoryDragStart(event,'${x.id}')" ondragend="categoryDragEnd(event)" ondragover="categoryDragOver(event)" ondragleave="categoryDragLeave(event)" ondrop="categoryDrop(event,'${x.id}')"><button onclick="active='${x.id}';render()"><span class="badge">${esc(x.name.slice(0,1))}</span>${esc(x.name)}</button>${x.id===active?`<button class="edit" onclick="openCategory(true)" title="修改分类名称">✎</button>`:''}</div>`).join('');document.getElementById('title').textContent=c.name+'网站';const cards=c.links.map(l=>`<div class="wrap" draggable="true" ondragstart="dragStart(event,'${l.id}')" ondragend="dragEnd(event)" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="dropLink(event,'${l.id}')"><a class="card" href="${esc(l.url)}" target="_blank" draggable="false"><span class="mark" style="background:${esc(l.color)}">${esc(l.mark)}</span><span class="copy"><strong>${esc(l.name)}</strong><small>${esc(l.description)}</small></span></a><button class="edit-link" onclick="openLink('${l.id}')" title="修改网站">✎</button><button class="del" onclick="removeLink('${l.id}')" title="删除网站">×</button></div>`).join('');document.getElementById('links').innerHTML=`<div class="grid">${cards}<button class="add-site-card" onclick="openLink()"><b>＋</b><span>添加网站</span></button></div>`}
    function categoryDragStart(event,id){draggedCategoryId=id;event.currentTarget.classList.add('category-dragging');event.dataTransfer.effectAllowed='move';event.dataTransfer.setData('text/category-id',id)}
    function categoryDragEnd(event){event.currentTarget.classList.remove('category-dragging');document.querySelectorAll('.category-drag-over').forEach(x=>x.classList.remove('category-drag-over'));draggedCategoryId=null}
    function categoryDragOver(event){event.preventDefault();event.dataTransfer.dropEffect='move';event.currentTarget.classList.add('category-drag-over')}
    function categoryDragLeave(event){event.currentTarget.classList.remove('category-drag-over')}
    function categoryDrop(event,targetId){event.preventDefault();event.currentTarget.classList.remove('category-drag-over');const sourceId=draggedCategoryId||event.dataTransfer.getData('text/category-id');if(!sourceId||sourceId===targetId)return;const from=data.findIndex(x=>x.id===sourceId);const to=data.findIndex(x=>x.id===targetId);if(from<0||to<0)return;const moved=data.splice(from,1)[0];data.splice(to,0,moved);save();render()}
    function deleteCategory(id){if(data.length<=1){alert('至少需要保留一个分类');return}const category=data.find(x=>x.id===id);if(!category||!confirm(`确定删除“${category.name}”分类吗？\n该分类中的网站也会一起删除。`))return;const index=data.findIndex(x=>x.id===id);data=data.filter(x=>x.id!==id);if(active===id)active=data[Math.min(index,data.length-1)].id;save();render()}
    function render(){const c=current();document.getElementById('categories').innerHTML=data.map(x=>`<div class="cat ${x.id===active?'active':''}" draggable="true" ondragstart="categoryDragStart(event,'${x.id}')" ondragend="categoryDragEnd(event)" ondragover="categoryDragOver(event)" ondragleave="categoryDragLeave(event)" ondrop="categoryDrop(event,'${x.id}')"><button onclick="active='${x.id}';render()"><span class="badge">${esc(x.name.slice(0,1))}</span><span>${esc(x.name)}</span></button>${x.id===active?`<button class="edit" onclick="openCategory(true)" title="修改分类名称">✎</button><button class="delete-category" onclick="deleteCategory('${x.id}')" title="删除分类">×</button>`:''}</div>`).join('');document.getElementById('title').textContent=c.name+'网站';const cards=c.links.map(l=>`<div class="wrap" draggable="true" ondragstart="dragStart(event,'${l.id}')" ondragend="dragEnd(event)" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="dropLink(event,'${l.id}')"><a class="card" href="${esc(l.url)}" target="_blank" draggable="false"><span class="mark" style="background:${esc(l.color)}">${esc(l.mark)}</span><span class="copy"><strong>${esc(l.name)}</strong><small>${esc(l.description)}</small></span></a><button class="edit-link" onclick="openLink('${l.id}')" title="修改网站">✎</button><button class="del" onclick="removeLink('${l.id}')" title="删除网站">×</button></div>`).join('');document.getElementById('links').innerHTML=`<div class="grid">${cards}<button class="add-site-card" onclick="openLink()"><b>＋</b><span>添加网站</span></button></div>`}
    let editMode=false;
    function toggleEditMode(){editMode=!editMode;document.body.classList.toggle('edit-mode',editMode);render()}
    const vectorLogoHosts=new Set(['zh.wikipedia.org','mail.163.com','fanyi.baidu.com']);
    const symbolLogoHosts=new Set(['www.amd.com','www.analog.com','www.microchip.com','www.skyworksinc.com','www.arm.com','www.panasonic.com']);
    function faviconUrl(url){try{const host=new URL(url).hostname;if(symbolLogoHosts.has(host))return 'logos/'+host+'-icon.svg';return 'logos/'+host+(vectorLogoHosts.has(host)?'.svg':'.png')}catch{return ''}}
    function logoClass(){return ''}
    function render(){
      const c=current();
      document.getElementById('categories').innerHTML=data.map(x=>`<div class="cat ${x.id===active?'active':''}" draggable="${editMode}" ondragstart="categoryDragStart(event,'${x.id}')" ondragend="categoryDragEnd(event)" ondragover="categoryDragOver(event)" ondragleave="categoryDragLeave(event)" ondrop="categoryDrop(event,'${x.id}')"><button onclick="active='${x.id}';render()"><span class="badge">${esc(x.name.slice(0,1))}</span><span>${esc(x.name)}</span></button>${editMode&&x.id===active?`<button class="edit" onclick="openCategory(true)" title="修改分类名称">✎</button><button class="delete-category" onclick="deleteCategory('${x.id}')" title="删除分类">×</button>`:''}</div>`).join('');
      document.getElementById('title').textContent=c.name+'网站';
      const cards=c.links.map(l=>`<div class="wrap" draggable="${editMode}" ondragstart="dragStart(event,'${l.id}')" ondragend="dragEnd(event)" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="dropLink(event,'${l.id}')"><a class="card" href="${esc(l.url)}" target="_blank" draggable="false"><span class="mark" style="background:${esc(l.color)}"><span>${esc(l.mark)}</span>${faviconUrl(l.url)?`<img class="${logoClass(l.url)}" src="${esc(faviconUrl(l.url))}" alt="" onerror="this.remove()">`:''}</span><span class="copy"><strong>${esc(l.name)}</strong><small>${esc(l.description)}</small></span></a>${editMode?`<button class="edit-link" onclick="openLink('${l.id}')" title="修改网站">✎</button><button class="del" onclick="removeLink('${l.id}')" title="删除网站">×</button>`:''}</div>`).join('');
      document.getElementById('links').innerHTML=`<div class="grid">${cards}${editMode?'<button class="add-site-card" onclick="openLink()"><b>＋</b><span>添加网站</span></button>':''}</div>`;
      const toggle=document.getElementById('editModeToggle');toggle.title=editMode?'退出修改模式':'进入修改模式';toggle.setAttribute('aria-label',toggle.title);
    }
    function openEngineHome(engine){const homes={baidu:'https://www.baidu.com/',google:'https://www.google.com/'};window.open(homes[engine],'_blank')}
    document.querySelectorAll('.search').forEach(f=>f.addEventListener('submit',e=>{e.preventDefault();const q=f.querySelector('input').value.trim();if(!q)return;const urls={baidu:'https://www.baidu.com/s?wd=',google:'https://www.google.com/search?q='};window.open(urls[f.dataset.engine]+encodeURIComponent(q),'_blank')}));
    function tick(){const d=new Date();const pad=n=>String(n).padStart(2,'0');const weeks=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];document.getElementById('time').textContent=`${pad(d.getHours())}:${pad(d.getMinutes())}`;document.getElementById('date').textContent=`${d.getFullYear()} 年 ${pad(d.getMonth()+1)} 月 ${pad(d.getDate())} 日 ${weeks[d.getDay()]}`}tick();setInterval(tick,30000);render();
  </script>
