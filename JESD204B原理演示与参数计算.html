<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JESD204B 原理演示与参数计算</title>
  <style>
    :root {
      color-scheme: light dark;
      --surface: #ffffff;
      --line: #ccd3dc;
      --link: #205b8c;
      --hover: #edf2f7;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #172029;
        --line: #415262;
        --link: #94caff;
        --hover: #273440;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      height: 100dvh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      background: var(--surface);
      font: 14px/1.5 Arial, "Microsoft YaHei", sans-serif;
    }
    nav { border-bottom: 1px solid var(--line); }
    .navigation {
      max-width: 1120px;
      margin-inline: auto;
      padding-inline: 24px;
    }
    .return-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 40px;
      margin: 2px -6px;
      padding-inline: 6px;
      border-radius: 5px;
      color: var(--link);
      text-decoration: none;
    }
    .return-link:hover { background: var(--hover); }
    .return-link:focus-visible {
      outline: 2px solid var(--link);
      outline-offset: 1px;
    }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
    @media (max-width: 560px) { .navigation { padding-inline: 12px; } }
  </style>
</head>
<body>
  <nav aria-label="工作台">
    <div class="navigation">
      <a class="return-link" href="./"><span aria-hidden="true">←</span>返回我的工作台</a>
    </div>
  </nav>
  <!-- Keep this URL for existing bookmarks. Deploy the standalone demo at jesd204b/demo.html. -->
  <iframe src="./jesd204b/demo.html" title="JESD204B 原理演示与参数计算"></iframe>
</body>
</html>
